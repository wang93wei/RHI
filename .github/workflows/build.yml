name: Build & Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - parallel:
          - name: Setup .NET 8 SDK
            uses: actions/setup-dotnet@v4
            with:
              dotnet-version: 8.0.x

          # Keep the default path: the app copies ClrMD from this directory.
          - name: Cache NuGet packages
            uses: actions/cache@v4
            with:
              path: ~/.nuget/packages
              key: ${{ runner.os }}-${{ runner.arch }}-nuget-v1-build-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
              restore-keys: |
                ${{ runner.os }}-${{ runner.arch }}-nuget-v1-build-

          - name: Check i18n catalogs
            run: python tools/check-i18n-coverage.py --strict

      - name: Build (Release x64)
        run: dotnet build RenoDXCommander.sln -c Release -p:Platform=x64

      - name: Run tests
        run: dotnet test RenoDXCommander.Tests/RenoDXCommander.Tests.csproj -c Release -p:Platform=x64 --no-build
