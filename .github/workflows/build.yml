name: Build & Test

on:
  # Manual trigger from the Actions tab — works on any branch.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release x64)
        run: dotnet build RenoDXCommander.sln -c Release

      - name: Run tests
        run: dotnet test RenoDXCommander.Tests/RenoDXCommander.Tests.csproj -c Release --no-build
